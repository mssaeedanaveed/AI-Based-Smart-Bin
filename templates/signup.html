<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Dust Bin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-header i {
            font-size: 3rem;
            color: #27ae60;
        }
        
        .form-header h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .form-control {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ecf0f1;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 0.2rem rgba(39, 174, 96, 0.25);
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.4);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <i class="bi bi-person-plus-fill"></i>
            <h2>Sign Up</h2>
            <p class="text-muted">Join Smart Dust Bin Company</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label><i class="bi bi-person"></i> Full Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-envelope"></i> Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-lock"></i> Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter password (min 6 characters)" required minlength="6">
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-lock-fill"></i> Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit" class="btn btn-submit">
                <i class="bi bi-check-circle"></i> Create Account
            </button>
        </form>
        
        <div class="back-link">
            Already have an account? <a href="{{ url_for('signin') }}">Sign In</a>
        </div>
        <div class="back-link">
            <a href="{{ url_for('index') }}"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
