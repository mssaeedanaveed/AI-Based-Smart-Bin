<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Smart Dust Bin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .icon {
            font-size: 4rem;
            color: #f39c12;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .info-text {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        
        .code-input {
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 10px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ecf0f1;
            margin-bottom: 20px;
        }
        
        .code-input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 0.2rem rgba(243, 156, 18, 0.25);
        }
        
        .btn-verify {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <i class="bi bi-envelope-check-fill icon"></i>
        <h2>Verify Your Email</h2>
        <p class="info-text">
            We've sent a 6-digit verification code to your email address.
            Please enter the code below.
        </p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('verify_email') }}">
            <input type="text" class="form-control code-input" name="verification_code" 
                   placeholder="000000" maxlength="6" pattern="\d{6}" required>
            
            <button type="submit" class="btn btn-verify">
                <i class="bi bi-check-circle"></i> Verify Email
            </button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-focus on code input
        document.querySelector('.code-input').focus();
    </script>
</body>
</html>
